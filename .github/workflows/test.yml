name: Test Kaizen
on:
  pull_request:
  push:
    branches: ['main', 'feature/**']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Verify published page matches the editable page
        run: cmp --silent index.html 'Gestor de Tareas.dc.html'
      - name: JavaScript and component checks
        run: node --test tests/planning.test.cjs tests/assistant-runs.test.cjs tests/calendar-regression.test.cjs tests/calendar-timezones.test.cjs tests/pomodoro.test.cjs
      - name: Install isolated browser QA tools
        run: |
          npm install --prefix "$RUNNER_TEMP/kaizen-browser" --no-save playwright@1.56.1
          "$RUNNER_TEMP/kaizen-browser/node_modules/.bin/playwright" install --with-deps chromium webkit
      - name: Desktop and touch browser interactions using synthetic preview data
        env:
          NODE_PATH: ${{ runner.temp }}/kaizen-browser/node_modules
        run: |
          node tests/browser-interactions.cjs
          node tests/pomodoro-browser.cjs
      - name: Save browser QA screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: kaizen-browser-qa
          path: test-results/
          if-no-files-found: ignore
      - name: PHP syntax and project policy
        run: |
          php -l api/index.php
          php -l api/projects.php
          php -l api/assistant-runs.php
          php -l api/project-policy.php
          php -l api/password-reset.php
          php -l api/password-reset-worker.php
          php -l api/mcp.php
          php -l api/mcp-core.php
          php -l api/mcp-oauth.php
          php -l api/oauth.php
          php -l tests/mcp-fixture.php
          php -l tests/projects-mysql.php
          php -l tests/password-reset-mysql.php
          php -l tests/password-race-mysql.php
          php -l tests/password-migration-mysql.php
          php -l tests/http-fixture.php
          php tests/project-policy.php
      - name: Start disposable test database
        run: |
          sudo systemctl start mysql.service
          mysql --host=127.0.0.1 --user=root --password=root -e 'CREATE DATABASE kaizen_test_projects CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci; CREATE DATABASE kaizen_test_http CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci; CREATE DATABASE kaizen_test_mcp CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci'
      - name: MySQL persistence and authorization
        env:
          KAIZEN_TEST_DSN: mysql:host=127.0.0.1;dbname=kaizen_test_projects
          KAIZEN_TEST_DB_USER: root
          KAIZEN_TEST_DB_PASSWORD: root # Disposable runner default; no production credentials.
        run: php tests/projects-mysql.php
      - name: Password recovery and change integration with fake mail
        env:
          KAIZEN_TEST_DSN: mysql:host=127.0.0.1;dbname=kaizen_test_projects
          KAIZEN_TEST_DB_USER: root
          KAIZEN_TEST_DB_PASSWORD: root # Disposable runner default; no production credentials.
        run: php tests/password-reset-mysql.php
      - name: Concurrent login and revocation integration
        env:
          KAIZEN_TEST_DSN: mysql:host=127.0.0.1;dbname=kaizen_test_projects
          KAIZEN_TEST_DB_USER: root
          KAIZEN_TEST_DB_PASSWORD: root # Disposable runner default; no production credentials.
        run: php tests/password-race-mysql.php
      - name: Additive migration from populated fixture
        env:
          KAIZEN_TEST_DSN: mysql:host=127.0.0.1;dbname=kaizen_test_projects
          KAIZEN_TEST_DB_USER: root
          KAIZEN_TEST_DB_PASSWORD: root # Disposable runner default; no production credentials.
        run: php tests/password-migration-mysql.php
      - name: HTTP sessions and delegation integration
        env:
          KAIZEN_TEST_DSN: mysql:host=127.0.0.1;dbname=kaizen_test_http
          KAIZEN_TEST_DB_USER: root
          KAIZEN_TEST_DB_PASSWORD: root # Disposable runner default.
        run: node --test tests/http.test.mjs

      - name: MCP OAuth and HTTP authorization
        env:
          KAIZEN_TEST_DSN: mysql:host=127.0.0.1;dbname=kaizen_test_mcp
          KAIZEN_TEST_DB_USER: root
          KAIZEN_TEST_DB_PASSWORD: root # Disposable runner default.
        run: node --test tests/mcp-http.test.mjs

  verify-publication:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Verify the public page and planning module match the merged source
        run: node tools/verify-publication.cjs
